<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPal REST Integration Example</title>
  <!-- Load the PayPal JS SDK with your Client ID and currency -->
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID&currency=GBP&components=buttons"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f6f8;
      margin: 0;
    }
    .checkout-card {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }
    h2 { margin-top: 0; color: #111; }
    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 18px;
      font-weight: 600;
    }
    #status-message {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <h2>UK Streaming Pass</h2>
    <p>1-Month Full 4K Access</p>
    <div class="price-row">
      <span>Total:</span>
      <span>£29.99</span>
    </div>

    <!-- Container for PayPal Smart Payment Buttons -->
    <div id="paypal-button-container"></div>
    <div id="status-message"></div>
  </div>

  <script>
    const statusDiv = document.getElementById('status-message');

    paypal.Buttons({
      // 1. Call your backend server to create the order securely
      createOrder: async () => {
        statusDiv.innerText = "Creating order...";
        const response = await fetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cart: [{ id: "streaming-pass-monthly", quantity: 1, amount: "29.99" }]
          })
        });

        const order = await response.json();
        return order.id; // Returns orderID string to PayPal SDK
      },

      // 2. Call your backend server to capture the order after buyer approval
      onApprove: async (data, actions) => {
        statusDiv.innerText = "Processing payment capture...";
        const response = await fetch(`/api/orders/${data.orderID}/capture`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const captureData = await response.json();

        // Check if capture succeeded or if instrument declined
        const errorDetail = captureData?.details?.[0];
        if (errorDetail?.issue === "INSTRUMENT_DECLINED") {
          // Recoverable state: prompt buyer to retry with alternate method
          return actions.restart();
        } else if (errorDetail) {
          throw new Error(`${errorDetail.description} (${captureData.debug_id})`);
        }

        statusDiv.innerText = `Payment Successful! Transaction ID: ${captureData.purchase_units[0].payments.captures[0].id}`;
        statusDiv.style.color = "green";
      },

      onError: (err) => {
        console.error("PayPal Checkout Error:", err);
        statusDiv.innerText = "An error occurred with your payment. Please try again.";
        statusDiv.style.color = "red";
      },

      onCancel: (data) => {
        statusDiv.innerText = "Payment cancelled by user.";
        statusDiv.style.color = "#666";
      }
    }).render('#paypal-button-container');
  </script>

</body>
</html>
